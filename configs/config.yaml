# Project configuration
project:
  name: "TrashBusters"
  description: "A project for classifying waste types using deep learning."
  version: "1.0.0"
  random_seed: 42

data:
  repo_id: "TrashBusters/combined"
  num_workers: 0

training:
  num_classes: 6
  batch_size: 32
  lr: 0.0001
  epochs: 20 # Default epoch ceiling per model; override per call via train_all(epochs=...)
  optimizer: "AdamW"
  loss: "CrossEntropyLoss"
  scheduler:
    factor: 0.5 # Halving the LR on a plateau provides a noticeable adaptation
    patience: 2 # Number of epochs without improvement, after which lr reduced
    threshold: 0.0001 # 1e-4 Ignores minor noisy decimal shifts at num precision 
    cooldown: 0 # Grace period of epochs to allow the training curve to stabilize
    min_lr: 0.000001 # 1e-6 Absolute floor; dropping below 1e-6 yields diminishing returns
  wandb:
    project: "trash-busters"
    entity: "trash-busters"
    dataset: "combined_waste_harmonized"
